[project]
name = "js-receptionist"
version = "0.1.0"
description = "AI voice receptionist for J's Cleaners"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[deepgram,openrouter,silero,websocket]==1.14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false
