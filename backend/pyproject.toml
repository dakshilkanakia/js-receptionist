[project]
name = "js-receptionist"
version = "0.1.0"
description = "AI voice receptionist for J's Cleaners"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[deepgram,openrouter,silero,websocket]==1.14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "phonenumbers>=9.0.42",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
