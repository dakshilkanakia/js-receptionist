# Render Blueprint: New -> Blueprint -> pick this repo. Creates the app and its database.
# Secrets marked "sync: false" are asked for once when the Blueprint is created.
services:
  - type: web
    name: js-receptionist
    runtime: docker
    # Starter (0.5 CPU): a call needs ~0.2 CPU; the free tier's ~0.1 made audio choppy.
    # Billed per second, so switch back to free after the review window.
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: js-db
          property: connectionString
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STT_ENGINE
        value: flux
      - key: LLM_MODEL
        value: anthropic/claude-haiku-5.5
      - key: OWNER_EMAIL
        value: owner@jscleaners-demo.com
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_CONCURRENT_CALLS
        value: "2"
      - key: CALLS_PER_IP_PER_HOUR
        value: "10"

databases:
  - name: js-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: js_receptionist
    user: js
